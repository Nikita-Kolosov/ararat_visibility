<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #1d1b19; --muted: #6f6a63; --line: #e3ddd4;
    --yes: #2f8f5b; --maybe: #c98a16; --no: #b9483d; --night: #c9c5be; --tab: #e9e4dc;
  }
  /* Тёмная тема: по системной настройке, если пользователь не выбрал светлую, или явно выбранная */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #15171b; --card: #1f2228; --text: #ece9e4; --muted: #9a958e; --line: #2e323a;

  }
  :root[data-theme="dark"] { --bg: #15171b; --card: #1f2228; --text: #ece9e4; --muted: #9a958e; --line: #2e323a;
    --yes: #4cc187; --maybe: #e6ad3c; --no: #e2685c; --night: #3a3e47; --tab: #262a31; color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: .02em; }
  .install { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 13px;
    font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .theme-switch { position: relative; width: 56px; height: 30px; flex: 0 0 auto; border: 1px solid var(--line);

  .theme-switch:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .theme-switch .icon { position: absolute; top: 50%; width: 14px; height: 14px; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; }
  .theme-switch .sun { left: 7px; } .theme-switch .moon { right: 7px; }
  .theme-switch .knob { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s ease;
    display: grid; place-items: center; color: var(--text); }
  .theme-switch .knob svg { width: 14px; height: 14px; }
  .theme-switch[aria-checked="true"] .knob { transform: translateX(26px); }
  .theme-switch .knob .k-moon { display: none; }
  .theme-switch[aria-checked="true"] .knob .k-sun { display: none; }
  .theme-switch[aria-checked="true"] .knob .k-moon { display: block; }
  @media (prefers-reduced-motion: reduce) { .theme-switch .knob { transition: none; } }
  .status { font-size: 13px; color: var(--maybe); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 16px; }

  .tabs { display: flex; gap: 4px; background: var(--tab); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600;

  .eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  .info:hover, .info[aria-expanded="true"] { color: var(--text); border-color: var(--text); }
  .info:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .info::before { content: ''; position: absolute; inset: -8px; }
  .info { position: relative; }
  .tip { position: absolute; z-index: 10; top: calc(100% + 6px); left: 0; width: min(280px, calc(100vw - 64px));
    background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 13px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .obs { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .obs-btns { display: flex; gap: 8px; }
  .obs button { border: 1px solid var(--line); background: var(--tab); color: var(--text); font: inherit; font-weight: 600;
    padding: 7px 14px; border-radius: 10px; cursor: pointer; }
  .obs button:hover { border-color: var(--muted); }
  .obs button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .factors-cap { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .hint { font-size: 13px; color: var(--muted); margin: -6px 0 14px; }
  .warn { color: var(--maybe); }

  .strip { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; }
  .hour { text-align: center; font-size: 10px; color: var(--muted); min-width: 0; }
  .bar { height: 26px; border-radius: 5px; margin-bottom: 2px; }
  .hour.now .bar { outline: 2px solid var(--text); outline-offset: 1px; }
  .hour.past { opacity: .35; }
  @media (max-width: 420px) { .hour:nth-child(odd) .lbl { visibility: hidden; } }

  .rows { margin-top: 16px; }
  .row { display: grid; grid-template-columns: 52px 12px 1fr auto; align-items: center; gap: 10px;
    padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .row.past { opacity: .45; }
  .row.now { font-weight: 600; }
  .row .t { font-variant-numeric: tabular-nums; color: var(--muted); }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; }
  .row .meta { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  @media (max-width: 420px) { .row { grid-template-columns: 44px 12px 1fr; } .row .meta { display: none; } }

  .day { padding: 14px 0; border-top: 1px solid var(--line); }
  .day:first-of-type { border-top: 0; padding-top: 0; }
  .day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .day-name { font-weight: 600; }
  .day-name small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .badge { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .badge.yes { background: var(--yes); } .badge.maybe { background: var(--maybe); } .badge.no { background: var(--no); }
  .day-text { font-size: 14px; color: var(--muted); margin-top: 6px; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .note { font-size: 13px; color: var(--muted); }
  .err { color: var(--no); }
  [hidden] { display: none !important; }
</style>

<body>
<main>
  <header>
    <h1>АРАРАТ ИЗ ЕРЕВАНА</h1>
    <div class="header-actions">
      <button class="install" id="install" hidden>Установить</button>
      <button class="theme-switch" id="theme" role="switch" aria-checked="false" aria-label="Тёмная тема" title="Тёмная тема">
        <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="knob">
          <svg class="k-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="k-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  <nav class="tabs" role="tablist">

  <div id="panel-today" role="tabpanel"><section class="card"><p class="verdict">Загружаю прогноз…</p></section></div>
  <div id="panel-tomorrow" role="tabpanel" hidden></div>

  <p class="note">Оценка строится по прогнозу <a href="https://open-meteo.com/" target="_blank" rel="noopener" style="color:inherit">Open-Meteo</a> (CC BY 4.0): облачность над вершиной и по пути к ней, видимость, влажность и аэрозоли (дымка, пыль) над Ереваном. Это прогноз, а не снимок.</p>

<script>
// Точки: вершина, середина пути, Ереван
const POINTS = [
  { name: 'summit',  lat: 39.702, lon: 44.299 },
  { name: 'path',    lat: 39.94,  lon: 44.40 },
  { name: 'yerevan', lat: 40.18,  lon: 44.51 },
];
const TZ = 'Asia/Yerevan';
const DAYS = 7;
const FIRST_HOUR = 5, LAST_HOUR = 20;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hourOf = t => +t.slice(11, 13);
const fmt = (v, d = 0) => v == null ? '—' : v.toFixed(d);

async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const CACHE_KEY = 'ararat-forecast';
// Модели облачности: они часто сильно расходятся, поэтому усредняем три
const MODELS = ['icon_seamless', 'ecmwf_ifs025', 'gfs_seamless'];
// Направление с Еревана на вершину (азимут, градусы от севера)
const ARARAT_AZIMUTH = 199;

async function fetchForecast() {
  const lats = POINTS.map(p => p.lat).join(','), lons = POINTS.map(p => p.lon).join(',');
  const tz = encodeURIComponent(TZ);
  const [w, m, a] = await Promise.all([
    // Ереван и общая погода (модель по умолчанию)
    getJson(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}` +
      `&hourly=cloud_cover_low,cloud_cover_mid,visibility,relative_humidity_2m,is_day` +
      `&timezone=${tz}&forecast_days=${DAYS}`),
    // облака и прямое солнце у вершины и по пути — по трём моделям; не загрузилось — обойдёмся одной
    getJson(`https://api.open-meteo.com/v1/forecast?latitude=${POINTS[0].lat},${POINTS[1].lat}` +
      `&longitude=${POINTS[0].lon},${POINTS[1].lon}` +
      `&hourly=cloud_cover_low,cloud_cover_mid,direct_normal_irradiance&models=${MODELS.join(',')}` +
      `&timezone=${tz}&forecast_days=${DAYS}`).catch(() => null),
    // аэрозоли есть только на ~4–5 дней вперёд; если API недоступен — живём без них
    getJson(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=40.18&longitude=44.51` +
      `&hourly=aerosol_optical_depth&timezone=${tz}&forecast_days=${DAYS}`).catch(() => null),
  ]);
  return { w, m, a, at: Date.now() };
}

// Положение солнца (упрощённая формула, точности в доли градуса хватает)
function sunPosition(ms, lat, lon) {
  const rad = Math.PI / 180, d = ms / 864e5 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * rad;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  const ha = (gmst * 15 + lon) * rad - ra;
  const la = lat * rad;
  const el = Math.asin(Math.sin(la) * Math.sin(dec) + Math.cos(la) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(la) - Math.sin(la) * Math.cos(ha));
  return { el: el / rad, az: (az / rad + 360) % 360 };
}

// Прямая радиация при чистом небе (модель Мейнела), Вт/м²; солнце низко — не оцениваем
function clearSkyDni(el) {
  if (el <= 5) return null;
  const am = 1 / (Math.sin(el * Math.PI / 180) + 0.50572 * Math.pow(el + 6.07995, -1.6364));
  return 1353 * Math.pow(0.7, Math.pow(am, 0.678));
}

const timeMs = t => Date.parse(t + ':00+04:00'); // Ереван: UTC+4 круглый год
const avg = xs => xs.reduce((s, x) => s + x, 0) / xs.length;

// Сеть, а без неё — последний удачный прогноз из localStorage
async function load() {
  try {
    const data = await fetchForecast();
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch {}
    return { ...data, stale: false };
  } catch (e) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
    if (!cached) throw e;
    return { ...cached, stale: true };
  }
}

// Облачность у вершины по одной модели с поправкой на прозрачность:
// если прямое солнце у вершины пробивается (DNI близка к чистому небу), облака тонкие и гору не прячут
function summitCloudOf(low, mid, dni, clear) {
  const raw = Math.max(mid, low * 0.8);
  if (clear == null || dni == null) return raw;
  const transparency = clamp(dni / (clear * 0.9));
  return raw * (1 - 0.8 * transparency);
}

function toHours({ w, m, a }) {
  const [summit, path, yerevan] = w.map(x => x.hourly);
  const aodByTime = new Map();
  if (a) a.hourly.time.forEach((t, i) => aodByTime.set(t, a.hourly.aerosol_optical_depth[i]));
  const [ms, mp] = m ? m.map(x => x.hourly) : [];

  return summit.time.map((t, i) => {
    // радиация в прогнозе — среднее за прошедший час, поэтому солнце берём на его середину
    const sunMid = sunPosition(timeMs(t) - 30 * 60e3, POINTS[0].lat, POINTS[0].lon);
    const clear = clearSkyDni(sunMid.el);
    let summitCloud, pathLow, spread = 0;
    const perModel = ms ? MODELS.map(k => ({
      c: ms[`cloud_cover_low_${k}`][i] == null ? null : summitCloudOf(ms[`cloud_cover_low_${k}`][i],
        ms[`cloud_cover_mid_${k}`][i], ms[`direct_normal_irradiance_${k}`][i], clear),
      low: mp[`cloud_cover_low_${k}`][i],
    })).filter(x => x.c != null && x.low != null) : [];
    if (perModel.length) {
      const cs = perModel.map(x => x.c);
      summitCloud = avg(cs);
      spread = Math.max(...cs) - Math.min(...cs);
      pathLow = avg(perModel.map(x => x.low));
    } else {
      summitCloud = Math.max(summit.cloud_cover_mid[i], summit.cloud_cover_low[i] * 0.8);
      pathLow = path.cloud_cover_low[i];
    }
    const sun = sunPosition(timeMs(t), POINTS[2].lat, POINTS[2].lon);
    const h = {
      time: t,
      day: yerevan.is_day[i] === 1,
      summitCloud,
      pathCloud: Math.max(pathLow, yerevan.cloud_cover_low[i]),
      spread,
      sun,
      vis: yerevan.visibility[i],
      rh: yerevan.relative_humidity_2m[i],
      aod: aodByTime.get(t) ?? null,
    };
    return { ...h, ...score(h) };
  });
}

// Грубая эвристика: вероятность увидеть гору 0..1
function score(h) {
  if (!h.day) return { p: 0, cls: 'night', label: 'Темно', reason: 'темно' };
  const clouds = clamp(Math.max(h.summitCloud, h.pathCloud) / 100);
  const hazeAod = h.aod == null ? 0 : clamp((h.aod - 0.12) / 0.4);
  const hazeVis = h.vis == null ? 0 : clamp((20000 - h.vis) / 15000);
  const hazeRh = clamp((h.rh - 75) / 25) * 0.5;
  const haze = Math.max(hazeAod, hazeVis, hazeRh);
  // Против солнца: солнце светит со стороны горы — она выглядит размыто даже в чистом воздухе
  let diff = Math.abs(h.sun.az - ARARAT_AZIMUTH) % 360;
  if (diff > 180) diff = 360 - diff;
  const backlight = h.sun.el > 0 ? clamp((50 - diff) / 50) : 0;
  const p = (1 - clouds) * (1 - haze * 0.85) * (1 - 0.25 * backlight);
  let reason;
  if (clouds > 0.6) reason = 'вершина в облаках';
  else if (haze > 0.5) reason = 'сильная дымка';
  else if (clouds > 0.3) reason = 'облака частично закрывают';
  else if (haze > 0.25) reason = 'лёгкая дымка';
  else reason = 'ясно';
  if (clouds <= 0.6 && backlight > 0.5)
    reason = reason === 'ясно' ? 'против солнца, контраст слабый' : reason + ', против солнца';
  if (h.spread > 60) reason += ' · прогнозы расходятся';
  if (p >= 0.6) return { p, cls: 'yes', label: 'Видно', reason };
  if (p >= 0.3) return { p, cls: 'maybe', label: 'Частично', reason };
  return { p, cls: 'no', label: 'Не видно', reason };
}

const nowKey = () => {
  const s = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit',
    day: '2-digit', hour: '2-digit', hourCycle: 'h23' }).format(new Date());
  return s.replace(' ', 'T').slice(0, 13) + ':00';
};

// Склеивает подряд идущие часы в интервалы: [8,9,10,14] -> "8–11, 14–15"
function ranges(hs) {
  const out = [];
  hs.forEach(h => {
    const x = hourOf(h.time), last = out[out.length - 1];
    if (last && last[1] === x) last[1] = x + 1; else out.push([x, x + 1]);
  });
  return out.map(([a, b]) => `${a}–${b}`).join(', ');
}

// from — с какого часа учитывать (для сегодня — с текущего)
function summarizeDay(hs, from) {
  const daylight = hs.filter(h => h.day);
  const pool = daylight.filter(h => h.time >= from);
  const yes = pool.filter(h => h.cls === 'yes');
  const maybe = pool.filter(h => h.cls === 'maybe');
  const best = [...pool].sort((a, b) => b.p - a.p)[0];
  const noAq = daylight.length > 0 && daylight.every(h => h.aod == null);
  let cls, label, text;
  if (yes.length >= 3) { cls = 'yes'; label = 'Хороший день'; }
  else if (yes.length || maybe.length >= 3) { cls = 'maybe'; label = 'Есть шанс'; }
  else { cls = 'no'; label = 'Скорее не видно'; }
  if (yes.length) text = `Видно: ${ranges(yes)}`;
  else if (maybe.length) text = `Частично: ${ranges(maybe)}`;
  else text = best ? `Весь день: ${best.reason}` : 'Светлых часов больше нет';
  if (yes.length && maybe.length) text += ` · частично: ${ranges(maybe)}`;
  return { cls, label, text, noAq, best, empty: !pool.length };
}

function dayTitle(d, today, tomorrow, withDate = true) {
  const date = new Date(d + 'T12:00');
  const wd = date.toLocaleDateString('ru-RU', { weekday: 'long' });
  const dm = date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const name = d === today ? 'Сегодня' : d === tomorrow ? 'Завтра' : wd[0].toUpperCase() + wd.slice(1);
  return withDate ? `${name}<small>${dm}</small>` : `${name}, ${dm}`;
}

const AOD_INFO = `
  <b>Аэрозоли</b> — дымка, пыль и смог в воздухе. Даже в безоблачный день из-за них гора может «растворяться» в мареве.
  <br><br><b>AOD</b> (аэрозольная оптическая толщина) — насколько они мутят воздух:
  <br>до 0.12 — воздух прозрачный
  <br>0.12–0.3 — лёгкая дымка
  <br>0.3–0.5 — сильная дымка
  <br>больше 0.5 — гору обычно не видно`;

// Иконка «i» с пояснением по клику (работает и на телефоне, где нет hover)
let infoSeq = 0;
function infoHtml(name, html) {
  const id = `info-${name}-${++infoSeq}`;
  return `<button class="info" type="button" aria-expanded="false" aria-controls="${id}" aria-label="Что это?">i</button>
    <div class="tip" id="${id}" role="tooltip" hidden>${html}</div>`;
}
function closeTips(except) {
  document.querySelectorAll('.info[aria-expanded="true"]').forEach(b => {
    if (b === except) return;
    b.setAttribute('aria-expanded', 'false');
    document.getElementById(b.getAttribute('aria-controls')).hidden = true;
  });
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.info');
  if (btn) {
    const open = btn.getAttribute('aria-expanded') !== 'true';
    closeTips(btn);
    btn.setAttribute('aria-expanded', open);
    document.getElementById(btn.getAttribute('aria-controls')).hidden = !open;
    if (open) track('info-aod', 'Открыли пояснение про AOD');
  } else if (!e.target.closest('.tip')) {
    closeTips();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTips(); });

function factorsHtml(h, caption) {
  return `
    <div class="factors">
      <div class="factor"><b>${fmt(h.summitCloud)}%</b><span>облака у вершины</span></div>
      <div class="factor"><b>${fmt(h.pathCloud)}%</b><span>низкие облака по пути</span></div>
      <div class="factor"><b>${fmt(h.aod, 2)}</b><span>аэрозоли (AOD)</span>${infoHtml('aod', AOD_INFO)}</div>
      <div class="factor"><b>${h.vis == null ? '—' : (h.vis / 1000).toFixed(0) + ' км'}</b><span>видимость в Ереване</span></div>
    </div>
    ${caption ? `<div class="factors-cap">${caption}</div>` : ''}`;
}

function stripHtml(hs, key) {
  return `<div class="strip">${hs.filter(h => hourOf(h.time) >= FIRST_HOUR && hourOf(h.time) <= LAST_HOUR).map(h => `
    <div class="hour ${h.time === key ? 'now' : ''} ${h.time < key ? 'past' : ''}"
         title="${hourOf(h.time)}:00 — ${h.label}${h.day ? ': ' + h.reason : ''}">
      <div class="bar" style="background:var(--${h.cls})"></div><span class="lbl">${hourOf(h.time)}</span>
    </div>`).join('')}
  </div>`;
}

function rowsHtml(hs, key) {
  return `<div class="rows">${hs.filter(h => h.day).map(h => `
    <div class="row ${h.time === key ? 'now' : ''} ${h.time < key ? 'past' : ''}">
      <span class="t">${h.time.slice(11, 16)}</span>
      <span class="dot" style="background:var(--${h.cls})"></span>
      <span>${h.label} <span class="${h.cls}" style="font-weight:400">· ${h.reason}</span></span>
      <span class="meta">облака ${fmt(Math.max(h.summitCloud, h.pathCloud))}% · AOD ${fmt(h.aod, 2)}</span>
    </div>`).join('')}
  </div>`;
}

const LEGEND = `
  <div class="legend">
    <span><i style="background:var(--yes)"></i>видно</span>
    <span><i style="background:var(--maybe)"></i>частично / дымка</span>
    <span><i style="background:var(--no)"></i>не видно</span>
    <span><i style="background:var(--night)"></i>темно</span>
  </div>`;

// Наблюдения «вижу / не вижу» для калибровки: событие obs-<ответ>-pred-<прогноз> в GoatCounter
// даёт таблицу «что предсказали × что увидели». Один ответ с устройства в час.
const OBS_KEY = 'ararat-obs';
function obsHtml(key, cur) {
  let answered = false;
  try { answered = localStorage.getItem(OBS_KEY) === key; } catch {}
  if (answered) return `<div class="obs"><span>Спасибо! Ответ учтён — это поможет точнее считать прогноз.</span></div>`;
  return `
    <div class="obs">
      <span>Вы в Ереване? Видно гору прямо сейчас?</span>
      <div class="obs-btns">
        <button type="button" data-obs="yes" data-pred="${cur.cls}" data-key="${key}">Вижу</button>
        <button type="button" data-obs="no" data-pred="${cur.cls}" data-key="${key}">Не вижу</button>
      </div>
    </div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-obs]');
  if (!b) return;
  const seen = b.dataset.obs === 'yes';
  const predLabel = { yes: 'видно', maybe: 'частично', no: 'не видно' }[b.dataset.pred] || b.dataset.pred;
  track(`obs-${b.dataset.obs}-pred-${b.dataset.pred}`, `Наблюдение: ${seen ? 'видно' : 'не видно'}; прогноз: ${predLabel}`);
  try { localStorage.setItem(OBS_KEY, b.dataset.key); } catch {}
  b.closest('.obs').innerHTML = '<span>Спасибо! Ответ учтён — это поможет точнее считать прогноз.</span>';
});

function renderToday(hs, key, today, tomorrow) {
  const cur = hs.find(h => h.time === key) ?? hs[0];
  const s = summarizeDay(hs, key);
  let sub = cur.day ? `Сейчас ${cur.reason}.` : 'Сейчас темно — гору не видно.';
  if (s.best && s.best.time !== cur.time && s.best.p > cur.p + 0.1)
    sub += ` Лучшее время сегодня — ${hourOf(s.best.time)}:00 (${s.best.label.toLowerCase()}).`;
  else if (s.empty) sub += ' Светлых часов сегодня больше нет — загляни во вкладку «Завтра».';
  return `
    <section class="card">
      <div class="eyebrow">${dayTitle(today, today, tomorrow, false)}, сейчас ${key.slice(11, 16)}</div>
      <p class="verdict ${cur.cls}">${cur.label}</p>
      <div class="sub">${sub}</div>
      ${factorsHtml(cur)}
      ${cur.day ? obsHtml(key, cur) : ''}
    </section>
    <section class="card">
      <h2>По часам</h2>
      ${stripHtml(hs, key)}
      ${rowsHtml(hs, key)}
      ${LEGEND}
    </section>`;
}

function renderTomorrow(hs, today, tomorrow) {
  if (!hs) return `<section class="card"><p class="sub">Нет прогноза на завтра.</p></section>`;
  const s = summarizeDay(hs, '');
  return `
    <section class="card">
      <div class="eyebrow">${dayTitle(tomorrow, today, tomorrow, false)}</div>
      <p class="verdict ${s.cls}">${s.label}</p>
      <div class="sub">${s.text}${s.best ? `. Лучшее время — ${hourOf(s.best.time)}:00.` : ''}</div>
      ${s.best ? factorsHtml(s.best, `Показатели в лучший час, ${s.best.time.slice(11, 16)}`) : ''}
    </section>
    <section class="card">
      <h2>По часам</h2>
      ${stripHtml(hs, '')}
      ${rowsHtml(hs, '')}
      ${LEGEND}
    </section>`;
}

function renderWeek(byDay, key, today, tomorrow) {
  return `
    <section class="card">
      <h2>Прогноз на неделю</h2>
      <p class="hint">Чем дальше день, тем ниже точность. После 3–4 дней это скорее ориентир.</p>
      ${Object.entries(byDay).map(([d, hs]) => {
        const s = summarizeDay(hs, d === today ? key : '');
        return `
        <div class="day">
          <div class="day-head">
            <div class="day-name">${dayTitle(d, today, tomorrow)}</div>
            <span class="badge ${s.cls}">${s.label}</span>
          </div>
          ${stripHtml(hs, key)}
          <div class="day-text">${s.text}${s.noAq ? ' · <span class="warn">нет прогноза дымки, оценка по облакам</span>' : ''}</div>
        </div>`;
      }).join('')}
      ${LEGEND}
    </section>`;
}

function render(hours) {
  const key = nowKey();
  const today = key.slice(0, 10);
  const tomorrow = new Date(Date.parse(today) + 864e5).toISOString().slice(0, 10);
  const byDay = {};
  hours.forEach(h => (byDay[h.time.slice(0, 10)] ??= []).push(h));

  document.getElementById('panel-today').innerHTML = renderToday(byDay[today] ?? hours, key, today, tomorrow);
  document.getElementById('panel-tomorrow').innerHTML = renderTomorrow(byDay[tomorrow], today, tomorrow);
  document.getElementById('panel-week').innerHTML = renderWeek(byDay, key, today, tomorrow);
}

// Аналитика: GoatCounter (без cookies). Пустой код — аналитика выключена.
// localhost GoatCounter сам не считает, так что локальная разработка статистику не портит.
const GOATCOUNTER_CODE = 'nikita-kolosov';
const gcQueue = [];
function gcSend(opts) {
  if (window.goatcounter && window.goatcounter.count) window.goatcounter.count(opts);
  else gcQueue.push(opts);
}
// Событие: открытие вкладки, установка и т.п. Видно в GoatCounter отдельной строкой.
function track(name, title) {
  if (GOATCOUNTER_CODE) gcSend({ path: name, title: title || name, event: true });
}
if (GOATCOUNTER_CODE) {
  window.goatcounter = { no_onload: true };
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://gc.zgo.at/count.js';
  s.dataset.goatcounter = `https://${GOATCOUNTER_CODE}.goatcounter.com/count`;
  s.onload = () => {
    window.goatcounter.count({ path: location.pathname });
    gcQueue.splice(0).forEach(o => window.goatcounter.count(o));
  };
  document.head.appendChild(s);
  // Запуск установленного приложения с рабочего экрана (Android/десктоп и iOS)
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone)
    track('launch-pwa', 'Запуск установленного приложения');
  // Один раз с каждого устройства: счётчик first-open = число новых устройств за период.
  // На сервер уходит только сам факт, без идентификаторов; флаг хранится на устройстве.
  // На iOS у установленного приложения своё хранилище, отдельное от Safari, — там это два устройства.
  try {
    if (!localStorage.getItem('ararat-first-open')) {
      localStorage.setItem('ararat-first-open', new Date().toISOString());
      track('first-open', 'Новое устройство');
    }
  } catch {}
}

// Табы
const tabs = [...document.querySelectorAll('[role=tab]')];
function selectTab(name) {
  tabs.forEach(b => {
    const on = b.dataset.tab === name;
    b.setAttribute('aria-selected', on);
    document.getElementById('panel-' + b.dataset.tab).hidden = !on;
  });
}
const TAB_TITLES = { today: 'Вкладка «Сегодня»', tomorrow: 'Вкладка «Завтра»', week: 'Вкладка «Неделя»' };
tabs.forEach(b => b.addEventListener('click', () => {
  if (b.getAttribute('aria-selected') !== 'true') track('tab-' + b.dataset.tab, TAB_TITLES[b.dataset.tab]);
  selectTab(b.dataset.tab);
}));

// Тема: по умолчанию системная; выбор в переключателе запоминается
const THEME_KEY = 'ararat-theme';
const THEME_COLORS = { light: '#f4f1ec', dark: '#15171b' };
const themeBtn = document.getElementById('theme');
const systemDark = matchMedia('(prefers-color-scheme: dark)');
const currentTheme = () => document.documentElement.dataset.theme || (systemDark.matches ? 'dark' : 'light');
function syncThemeUi() {
  const dark = currentTheme() === 'dark';
  themeBtn.setAttribute('aria-checked', dark);
  const label = dark ? 'Светлая тема' : 'Тёмная тема';
  themeBtn.setAttribute('aria-label', label);
  themeBtn.title = label;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    m.content = document.documentElement.dataset.theme
      ? THEME_COLORS[currentTheme()]
      : THEME_COLORS[m.media.includes('dark') ? 'dark' : 'light'];
  });
}
themeBtn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem(THEME_KEY, next); } catch {}
  syncThemeUi();
  track('theme-' + next, next === 'dark' ? 'Включили тёмную тему' : 'Включили светлую тему');
});
systemDark.addEventListener('change', syncThemeUi);
syncThemeUi();

// Загрузка и обновление
let loadedAt = 0;
async function refresh() {
  const status = document.getElementById('status');
  try {
    const data = await load();
    loadedAt = data.at;
    render(toHours(data));
    if (data.stale) {
      const when = new Date(data.at).toLocaleString('ru-RU', { timeZone: TZ, day: 'numeric', month: 'long',
        hour: '2-digit', minute: '2-digit' });
      status.textContent = `Нет сети — показан прогноз от ${when}.`;
    }
    status.hidden = !data.stale;
  } catch (e) {
    status.hidden = true;
    document.getElementById('panel-today').innerHTML =
      `<section class="card"><p class="verdict err">Не удалось загрузить прогноз</p><div class="sub">${e.message}</div></section>`;
    selectTab('today');
  }
}
refresh();
// Вернулись в приложение спустя 30+ минут — обновляем прогноз
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() - loadedAt > 30 * 60 * 1000) refresh();
});
window.addEventListener('online', refresh);

// PWA: офлайн-оболочка и кнопка установки (Chrome/Android; на iOS — «Поделиться → На экран Домой»)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installPrompt = null;
const installBtn = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  installBtn.hidden = false;
});
installBtn.addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  installBtn.hidden = true;
});
window.addEventListener('appinstalled', () => {
  installBtn.hidden = true;
  track('installed', 'Установили приложение');
});
</script>
</body>
</html>
